<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>COT Caption Creator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f4f0;
    min-height: 100vh;
    color: #1a1a1a;
  }

  header {
    background: #1a1a2e;
    color: white;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .cross-icon {
    width: 32px; height: 32px;
    background: #c8a96e;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700; color: white; flex-shrink: 0;
  }

  header h1 { font-size: 18px; font-weight: 600; letter-spacing: 0.3px; }
  header p { font-size: 13px; color: rgba(255,255,255,0.6); margin-top: 2px; }

  main { max-width: 780px; margin: 0 auto; padding: 36px 24px 60px; }

  .card {
    background: white;
    border-radius: 14px;
    border: 1px solid #e8e5e0;
    padding: 28px 32px;
    margin-bottom: 20px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 16px;
  }

  .field-group { margin-bottom: 20px; }
  .field-group:last-child { margin-bottom: 0; }

  label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    color: #333;
    margin-bottom: 7px;
  }

  .field-hint {
    font-size: 12px;
    color: #999;
    margin-top: 5px;
  }

  input[type="text"] {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #e0ddd8;
    border-radius: 8px;
    font-size: 15px;
    color: #1a1a1a;
    background: #fafaf8;
    transition: border-color 0.15s;
    outline: none;
  }

  input[type="text"]:focus { border-color: #c8a96e; background: white; }
  input[type="text"]::placeholder { color: #bbb; }

  .file-drop {
    border: 2px dashed #d5d1ca;
    border-radius: 10px;
    background: #fafaf8;
    padding: 28px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .file-drop:hover, .file-drop.drag-over {
    border-color: #c8a96e;
    background: #fdf8f0;
  }

  .file-drop input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .file-drop-icon { font-size: 28px; margin-bottom: 8px; }
  .file-drop-text { font-size: 14px; color: #666; }
  .file-drop-text strong { color: #c8a96e; }
  .file-drop-sub { font-size: 12px; color: #aaa; margin-top: 4px; }

  .file-selected {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    background: #f0faf4;
    border: 1.5px solid #6cb88a;
    border-radius: 8px;
    margin-top: 10px;
  }

  .file-selected-icon { font-size: 20px; }
  .file-selected-name { font-size: 14px; font-weight: 500; color: #2d6e4e; flex: 1; }
  .file-selected-size { font-size: 12px; color: #888; }
  .remove-file { cursor: pointer; color: #999; font-size: 18px; line-height: 1; padding: 2px 4px; border-radius: 4px; }
  .remove-file:hover { color: #e24b4a; background: #fff0f0; }

  .or-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 14px 0;
    color: #bbb; font-size: 12px;
  }
  .or-divider::before, .or-divider::after {
    content: ''; flex: 1; height: 1px; background: #e8e5e0;
  }

  textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e0ddd8;
    border-radius: 8px;
    font-size: 14px;
    color: #1a1a1a;
    background: #fafaf8;
    resize: vertical;
    min-height: 140px;
    line-height: 1.6;
    transition: border-color 0.15s;
    outline: none;
    font-family: inherit;
  }

  textarea:focus { border-color: #c8a96e; background: white; }
  textarea::placeholder { color: #bbb; }

  .generate-btn {
    width: 100%;
    padding: 15px 24px;
    background: #1a1a2e;
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }

  .generate-btn:hover:not(:disabled) { background: #2a2a4e; }
  .generate-btn:active:not(:disabled) { transform: scale(0.99); }
  .generate-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .result-card {
    background: white;
    border-radius: 14px;
    border: 1px solid #e8e5e0;
    overflow: hidden;
    margin-top: 24px;
  }

  .result-header {
    padding: 18px 24px;
    background: #1a1a2e;
    color: white;
    display: flex; align-items: center; justify-content: space-between;
  }

  .result-header-left { display: flex; align-items: center; gap: 10px; }
  .result-header h2 { font-size: 15px; font-weight: 600; }
  .result-header p { font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 1px; }

  .copy-btn {
    padding: 8px 16px;
    background: #c8a96e;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
    flex-shrink: 0;
  }

  .copy-btn:hover { background: #b8953e; }
  .copy-btn.copied { background: #4a9e6e; }

  .caption-output {
    padding: 24px;
    font-size: 15px;
    line-height: 1.75;
    color: #1a1a1a;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 200px;
  }

  .checklist {
    border-top: 1px solid #e8e5e0;
    padding: 20px 24px;
    background: #fafaf8;
  }

  .checklist h3 {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 14px;
  }

  .checklist-items { display: flex; flex-direction: column; gap: 8px; }

  .checklist-item {
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: #444;
  }

  .check { width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; }
  .check.pass { background: #d4f0e0; color: #2d6e4e; }
  .check.fail { background: #fde8e8; color: #a32d2d; }
  .check.pending { background: #eee; color: #aaa; }

  .error-banner {
    background: #fff0f0;
    border: 1px solid #f0bfbf;
    border-radius: 10px;
    padding: 16px 20px;
    color: #a32d2d;
    font-size: 14px;
    margin-top: 16px;
    display: flex; gap: 10px; align-items: flex-start;
  }

  .char-count {
    font-size: 12px;
    color: #aaa;
    text-align: right;
    margin-top: 5px;
  }
</style>
</head>
<body>

<header>
  <div class="cross-icon">✝</div>
  <div>
    <h1>COT Caption Creator</h1>
    <p>Christ Oasis Tabernacle — Social Media Team</p>
  </div>
</header>

<main>
  <div class="card">
    <div class="section-label">Step 1 — Preacher Info</div>

    <div class="field-group">
      <label for="preacher-title">Title</label>
      <input type="text" id="preacher-title" placeholder="e.g. Pastor, Apostle, Evangelist, Bishop" />
    </div>

    <div class="field-group">
      <label for="preacher-name">Full Name</label>
      <input type="text" id="preacher-name" placeholder="e.g. Rhoda Dibie" />
    </div>
  </div>

  <div class="card">
    <div class="section-label">Step 2 — Sermon Transcript</div>

    <div class="field-group">
      <label>Upload transcript file</label>
      <div class="file-drop" id="file-drop">
        <input type="file" id="file-input" accept=".txt,.docx,.pdf,.doc" />
        <div class="file-drop-icon">📄</div>
        <div class="file-drop-text"><strong>Click to upload</strong> or drag and drop</div>
        <div class="file-drop-sub">.txt, .docx, .pdf supported</div>
      </div>
      <div id="file-selected-display" style="display:none;"></div>
    </div>

    <div class="or-divider">or paste transcript directly</div>

    <div class="field-group">
      <label for="transcript-text">Paste transcript</label>
      <textarea id="transcript-text" placeholder="Paste the sermon transcript here..."></textarea>
      <div class="char-count" id="char-count">0 characters</div>
    </div>
  </div>

  <button class="generate-btn" id="generate-btn" onclick="generateCaption()">
    <span id="btn-text">Generate Caption</span>
  </button>

  <div id="error-container"></div>
  <div id="result-container"></div>
</main>

<script>
const SOP = `You are a social media caption writer for Christ Oasis Tabernacle (COT) in Dolton, IL.

You MUST produce a caption that follows this EXACT 7-section structure in this EXACT order. Do not skip any section. Do not reorder sections.

SECTION 1 — OPENING QUOTE
- Pull a verbatim, word-for-word quote from the transcript
- Wrap in quotation marks
- Choose a quote that is punchy, convicting, or thought-provoking
- 1–2 sentences max

SECTION 2 — SPEAKER HASHTAG
- Format: #[Title][FirstName][LastName] — CamelCase, no spaces
- On its own line immediately after the quote
- Example: #PastorRhodaDibie

SECTION 3 — SUMMARY (1–2 sentences)
- 1–2 sentences only
- Reference the preacher by their full title and name
- Capture the core message of the sermon
- End on an encouraging or faith-affirming note

SECTION 4 — CALL TO ACTION (FIXED — copy exactly)
Visit our YouTube to watch the Full Sermon. The link is in Bio.

SECTION 5 — SERVICE INFORMATION (FIXED — copy exactly)
Come Fellowship with us every Sunday from 10:30 AM to 12:30 PM at 820 California Ave, Dolton, IL 60419
Otherwise, tune into our Facebook and YouTube Live every Sunday at 11:30 AM

SECTION 6 — CLOSING MOTTO (FIXED — copy exactly)
Times of Refreshing, Always Come from the Presence of the Lord!

SECTION 7 — HASHTAG BLOCK
Always include ALL of these 13 core hashtags:
#christoasistabernacle #christoasis #oasis #nondenominational #african #africanamerican #jesussaves #doltonillinois #jesus #faith #faithbased #christian #salvation

Then add the speaker hashtag (same as Section 2).
Then add 1–3 topical hashtags relevant to the sermon (e.g. #purpose #identity #grace).
Do NOT exceed 30 hashtags total.

After the caption, output a PRE-POST CHECKLIST in this exact format:

---CHECKLIST---
QUOTE_VERBATIM: PASS or FAIL
SPEAKER_HASHTAG_CAMELCASE: PASS or FAIL
SUMMARY_REFERENCES_PREACHER: PASS or FAIL
CTA_EXACT: PASS or FAIL
SERVICE_INFO_EXACT: PASS or FAIL
CLOSING_MOTTO_EXACT: PASS or FAIL
CORE_HASHTAGS_ALL_PRESENT: PASS or FAIL
SPEAKER_HASHTAG_IN_BLOCK: PASS or FAIL
HASHTAG_COUNT_UNDER_30: PASS or FAIL (X total)
---END CHECKLIST---`;

let fileContent = '';
let selectedFile = null;

const fileInput = document.getElementById('file-input');
const fileDropEl = document.getElementById('file-drop');
const fileSelectedDisplay = document.getElementById('file-selected-display');
const transcriptText = document.getElementById('transcript-text');
const charCount = document.getElementById('char-count');

transcriptText.addEventListener('input', () => {
  charCount.textContent = transcriptText.value.length.toLocaleString() + ' characters';
});

fileDropEl.addEventListener('dragover', (e) => { e.preventDefault(); fileDropEl.classList.add('drag-over'); });
fileDropEl.addEventListener('dragleave', () => fileDropEl.classList.remove('drag-over'));
fileDropEl.addEventListener('drop', (e) => {
  e.preventDefault();
  fileDropEl.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

fileInput.addEventListener('change', (e) => {
  if (e.target.files[0]) handleFile(e.target.files[0]);
});

function handleFile(file) {
  selectedFile = file;
  fileDropEl.style.display = 'none';
  fileSelectedDisplay.style.display = 'block';
  const sizeKB = (file.size / 1024).toFixed(1);
  fileSelectedDisplay.innerHTML = `
    <div class="file-selected">
      <span class="file-selected-icon">📄</span>
      <span class="file-selected-name">${file.name}</span>
      <span class="file-selected-size">${sizeKB} KB</span>
      <span class="remove-file" onclick="removeFile()">✕</span>
    </div>`;
  const reader = new FileReader();
  reader.onload = (e) => { fileContent = e.target.result; };
  reader.readAsText(file);
}

function removeFile() {
  selectedFile = null; fileContent = '';
  fileDropEl.style.display = 'block';
  fileSelectedDisplay.style.display = 'none';
  fileInput.value = '';
}

function setLoading(loading) {
  const btn = document.getElementById('generate-btn');
  const btnText = document.getElementById('btn-text');
  btn.disabled = loading;
  if (loading) {
    btn.innerHTML = '<div class="spinner"></div><span>Generating caption...</span>';
  } else {
    btn.innerHTML = '<span id="btn-text">Generate Caption</span>';
  }
}

function showError(msg) {
  document.getElementById('error-container').innerHTML = `
    <div class="error-banner"><span>⚠</span><span>${msg}</span></div>`;
}

function clearError() {
  document.getElementById('error-container').innerHTML = '';
}

function parseChecklist(raw) {
  const items = [
    { key: 'QUOTE_VERBATIM', label: 'Opening quote is verbatim from transcript' },
    { key: 'SPEAKER_HASHTAG_CAMELCASE', label: 'Speaker hashtag is CamelCase with no spaces' },
    { key: 'SUMMARY_REFERENCES_PREACHER', label: 'Summary references the preacher by name' },
    { key: 'CTA_EXACT', label: 'Call to action copied exactly' },
    { key: 'SERVICE_INFO_EXACT', label: 'Service info copied exactly' },
    { key: 'CLOSING_MOTTO_EXACT', label: 'Closing motto copied exactly' },
    { key: 'CORE_HASHTAGS_ALL_PRESENT', label: 'All 13 core hashtags present' },
    { key: 'SPEAKER_HASHTAG_IN_BLOCK', label: 'Speaker hashtag in hashtag block' },
    { key: 'HASHTAG_COUNT_UNDER_30', label: 'Total hashtags do not exceed 30' },
  ];
  const results = [];
  for (const item of items) {
    const regex = new RegExp(item.key + ':\\s*(PASS|FAIL[^\\n]*)', 'i');
    const match = raw.match(regex);
    const status = match ? match[1].trim().toUpperCase().startsWith('PASS') ? 'pass' : 'fail' : 'pending';
    const detail = match ? match[1] : '';
    results.push({ label: item.label + (detail && detail.includes('(') ? ' ' + detail.match(/\(.*?\)/)?.[0] || '' : ''), status });
  }
  return results;
}

function renderResult(captionOnly, checklistRaw) {
  const checkItems = parseChecklist(checklistRaw);
  const allPass = checkItems.every(i => i.status === 'pass');
  const checkHTML = checkItems.map(item => `
    <div class="checklist-item">
      <div class="check ${item.status}">${item.status === 'pass' ? '✓' : item.status === 'fail' ? '✗' : '?'}</div>
      <span>${item.label}</span>
    </div>`).join('');

  document.getElementById('result-container').innerHTML = `
    <div class="result-card">
      <div class="result-header">
        <div class="result-header-left">
          <div>
            <h2>Caption Ready</h2>
            <p>${allPass ? 'All checks passed ✓' : 'Review checklist below'}</p>
          </div>
        </div>
        <button class="copy-btn" id="copy-btn" onclick="copyCaption()">Copy Caption</button>
      </div>
      <div class="caption-output" id="caption-output">${escapeHtml(captionOnly)}</div>
      <div class="checklist">
        <h3>Pre-post checklist</h3>
        <div class="checklist-items">${checkHTML}</div>
      </div>
    </div>`;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function copyCaption() {
  const text = document.getElementById('caption-output').innerText;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = 'Copy Caption'; btn.classList.remove('copied'); }, 2000);
  });
}

async function generateCaption() {
  clearError();
  const title = document.getElementById('preacher-title').value.trim();
  const name = document.getElementById('preacher-name').value.trim();
  const pastedText = transcriptText.value.trim();
  const transcript = fileContent || pastedText;

  if (!title) { showError('Please enter the preacher\'s title (e.g. Pastor, Apostle, Evangelist).'); return; }
  if (!name) { showError('Please enter the preacher\'s full name.'); return; }
  if (!transcript) { showError('Please upload a transcript file or paste the transcript text.'); return; }

  setLoading(true);
  document.getElementById('result-container').innerHTML = '';

  const userPrompt = `Preacher: ${title} ${name}

Transcript:
${transcript.substring(0, 12000)}`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SOP,
        messages: [{ role: 'user', content: userPrompt }]
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || 'API error');
    }

    const data = await response.json();
    const fullText = data.content.map(b => b.text || '').join('');

    const checklistMatch = fullText.match(/---CHECKLIST---([\s\S]*?)---END CHECKLIST---/);
    const checklistRaw = checklistMatch ? checklistMatch[1] : '';
    const captionOnly = fullText.replace(/---CHECKLIST---[\s\S]*?---END CHECKLIST---/, '').trim();

    renderResult(captionOnly, checklistRaw);
  } catch (err) {
    showError('Something went wrong: ' + err.message);
  } finally {
    setLoading(false);
  }
}
</script>
</body>
</html>
